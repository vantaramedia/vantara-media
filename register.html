<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creator Registration | Vantara Media</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b0b0f;
color:white;
padding:30px 15px;
}


.container{
max-width:600px;
margin:auto;
background:#15151d;
padding:35px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
}


.logo{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:10px;
}

.logo span{
color:#8b5cf6;
}


.subtitle{
text-align:center;
color:#aaa;
margin-bottom:30px;
}


label{
display:block;
margin-top:18px;
margin-bottom:8px;
color:#ddd;
}


input, select, textarea{

width:100%;
padding:14px;
background:#0b0b0f;
border:1px solid #333;
border-radius:10px;
color:white;
font-size:15px;

}


textarea{
height:100px;
resize:none;
}


button{

margin-top:25px;
width:100%;
padding:15px;
background:#8b5cf6;
border:none;
border-radius:30px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;

}


.note{

margin-top:20px;
font-size:13px;
color:#888;
text-align:center;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
Vantara <span>Media</span>
</div>


<p class="subtitle">
Creator Partnership Registration
</p>


<form>


<label>
Full Name
</label>

<input type="text" placeholder="Enter your name">


<label>
Instagram Username
</label>

<input type="text" placeholder="@username">


<label>
Main Platform
</label>

<select>

<option>Instagram</option>
<option>YouTube</option>
<option>Facebook</option>
<option>Telegram</option>
<option>Other</option>

</select>

<label>
Followers / Subscribers
</label>

<input type="text" placeholder="Example: 50K">


<label>
Content Category
</label>

<select>

<option>Entertainment</option>
<option>Movies & Series</option>
<option>Gaming</option>
<option>Fashion</option>
<option>Other</option>

</select>


<label>
Contact Details
</label>

<input type="text" placeholder="Email or Telegram username">


<label>
About Your Audience
</label>

<textarea placeholder="Tell us about your audience and content"></textarea>


<button>
Submit Application
</button>


</form>


<p class="note">
Applications are reviewed manually by Vantara Media team.
</p>


</div>

<script>

const form = document.querySelector("form");

form.addEventListener("submit", async function(e){

e.preventDefault();

const data = {

name: document.querySelector('input[placeholder="Enter your name"]').value,

instagram: document.querySelector('input[placeholder="@username"]').value,

platform: document.querySelector("select").value,

followers: document.querySelector('input[placeholder="Example: 50K"]').value,

category: document.querySelectorAll("select")[1].value,

contact: document.querySelector('input[placeholder="Email or Telegram username"]').value

};

try{

const response = await fetch("https://script.google.com/macros/s/AKfycbyyIuD77L0MDha73b8RUuWtmgejQ2836fvSEaWSUPx1doPrdjyZ8sbQo3iimwYjIgAd/exec",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});

if(response.ok){

window.location.href="success.html";

}else{

alert("Application could not be submitted. Please try again.");

}

}catch(error){

alert("Connection error. Please try again.");

}

});

</script>
  
</body>
</html>
