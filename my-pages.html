<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Pages | Vantara Media</title>

<link rel="stylesheet" href="assets/css/my-pages.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">
<h2>Vantara <span>Media</span></h2>
</div>

<nav>

<a href="creator-dashboard.html">🏠 Dashboard</a>

<a href="available-campaigns.html">📢 Campaigns</a>

<a href="my-applications.html">📝 My Applications</a>

<a href="my-pages.html" class="active">📱 My Pages</a>

<a href="payments.html">💰 Payments</a>

<a href="profile.html">👤 Profile</a>

<a href="login.html">🚪 Logout</a>

</nav>

</aside>

<!-- Main -->

<main class="main-content">

<header class="topbar">

<div>

<h1>My Pages</h1>

<p>Add all your social media pages here.</p>

</div>

<button id="addPageBtn">

+ Add New Page

</button>

</header>

<div class="table-box">

<table>

<thead>

<tr>

<th>Platform</th>

<th>Page Name</th>

<th>Page URL</th>

<th>Followers</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="pagesTable"></tbody>

</table>

</div>

</main>

</div>

<!-- Add Page Popup -->

<div id="pageModal" class="modal">

<div class="modal-box">

<h2>Add New Page</h2>

<form id="pageForm">

  <input type="hidden" id="pageId">

<label>Platform</label>

<select id="platform" required>

<option value="">Select Platform</option>

<option>Instagram</option>

<option>YouTube</option>

<option>Facebook</option>

<option>Telegram</option>

</select>

<label>Page Name</label>

<input
type="text"
id="pageName"
placeholder="Enter Page Name"
required>

<label>Page URL</label>

<input
type="url"
id="username"
placeholder="https://instagram.com/yourpage"
required>

<label>Followers</label>

<input
type="number"
id="followers"
placeholder="Followers"
required>

<div class="popup-buttons">

<button type="submit" id="savePageBtn">
Save Page
</button>

<button type="button" id="closePopup">
Cancel
</button>

</div>

</form>

</div>

</div>

<!-- Edit Page Popup -->

<div id="editPageModal" class="modal">

    <div class="modal-box">

        <h2>Edit Page</h2>

        <form id="editPageForm">

            <input type="hidden" id="editPageId">

            <label>Page Name</label>

            <input
                type="text"
                id="editPageName"
                placeholder="Enter Page Name"
                required>

            <label>Page URL</label>

            <input
                type="url"
                id="editPageUrl"
                placeholder="https://instagram.com/yourpage"
                required>

            <label>Followers</label>

            <input
                type="number"
                id="editFollowers"
                placeholder="Followers"
                required>

            <div class="popup-buttons">

                <button type="submit">
                    Save Changes
                </button>

                <button
                    type="button"
                    id="closeEditPopup">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>
  
<script src="assets/js/my-pages.js"></script>

</body>

</html>
